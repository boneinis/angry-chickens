<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Chickens</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- Heads-up display drawn as crisp HTML over the canvas -->
    <div id="hud">
      <div class="hud-pill" id="level-pill">Level 1</div>
      <div class="hud-pill" id="cats-pill">🐱 × 3</div>
      <div class="hud-pill" id="score-pill">Score: 0</div>
      <button id="levels-btn" class="hud-pill" title="Level select">☰</button>
      <button id="mute-btn" class="hud-pill" title="Toggle sound">🔊</button>
    </div>

    <!-- Center overlay: title menu, results, game over, and level select.
         Contents are rendered by ui.js. -->
    <div id="overlay" class="hidden">
      <div id="overlay-card"></div>
    </div>

    <div id="hint">Drag the cat back &amp; release to fling</div>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
